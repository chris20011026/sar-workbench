[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alosstack-helper"
version = "0.4.0"
description = "Local visual SAR workbench for ISCE2 alosStack, alos2App and MintPy"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
alosstack-helper = "alosstack_helper.server:main"

[tool.setuptools.package-data]
alosstack_helper = ["static/*"]
